<section class="container contact-container">
<h1 class="section-title">Contactez-nous</h1>

<div class="confirmation" *ngIf="messageEnvoye">
Merci {{ nom || 'à vous' }}! Votre message a bien été pris en compte.
</div>

<form class="contact-form" (ngSubmit)="envoyerFormulaire()">
  <div class="form-group">
    <label for="nom">Nom complet</label>
    <input id="nom" type="text" name="nom" [(ngModel)]="nom" required placeholder="Votre nom">
  </div>
  <div class="form-group">
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" name="email" [(ngModel)]="email" required placeholder="vous@exemple.com">
  </div>
  <div class="form-group">
    <label for="sujet">Sujet</label>
    <input id="sujet" type="text" name="sujet" [(ngModel)]="sujet" placeholder="Objet de votre message">
  </div>
  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" [(ngModel)]="message" required placeholder="Votre message"></textarea>
  </div>
  <button type="submit" class="btn" [disabled]="!nom ||!email ||!message">Envoyer le message</button>
</form>
</section>
